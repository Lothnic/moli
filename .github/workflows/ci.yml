          --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Render job summary
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        run: |
          if [[ -f "$BENCHMARK_OUTPUT/comment.md" ]]; then
            cat "$BENCHMARK_OUTPUT/comment.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload full evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spider-bench-results
          path: ${{ env.BENCHMARK_OUTPUT }}
          if-no-files-found: error
          retention-days: 14

  sequential-navigation-soak:
    name: Sequential navigation soak · 200 A/B
    needs: [resolve-refs, build-release-head, build-release-base]
    if: >-
      inputs.run_webfetch_comparison != true &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'))
    runs-on: [self-hosted, moli-ci]
    timeout-minutes: 90
    container: rust:1.96.1-bookworm
    env:
      BENCHMARK_OUTPUT: sequential-navigation-soak-results
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-refs.outputs.head_sha }}
      - name: Use HEAD release
        uses: ./.github/actions/use-ci-release
        with:
          side: head
          revision: ${{ needs.resolve-refs.outputs.head_sha }}
      - name: Use base release
        uses: ./.github/actions/use-ci-release
        with:
          side: base
          revision: ${{ needs.resolve-refs.outputs.base_sha }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.14
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: moli-benchmark/uv.lock
      - run: uv sync --project moli-benchmark --locked
      - name: Run one-session public-web A/B
        id: soak
        shell: bash
        env:
          EXECUTION_ORDER: ${{ needs.resolve-refs.outputs.execution_order }}
        run: |
          set -euo pipefail
          run_side() {
            local side=$1
            local binary=$2
            set +e
            uv run --project moli-benchmark --no-sync python \
              moli-benchmark/scripts/fuzz-cdp-sequential-navigate.py \
              --engine moli --moli-bin "$binary" \
              --url https://www.csdn.net/ \
              --url https://segmentfault.com/ \
              --url https://huaban.com/ \
              --url https://example.com/ \
              --rounds 50 --network-diagnostics --navigation-resource-samples \
              --response-timeout 15 --dcl-timeout 14 --load-timeout 20 \
              --postcheck-timeout 5 --recovery-timeout 8 \
              --output "$BENCHMARK_OUTPUT/$side.json"
            local status=$?
            set -e
            echo "${side}_exit_code=$status" >> "$GITHUB_OUTPUT"
          }
          if [[ "$EXECUTION_ORDER" == head-first ]]; then
            run_side head "$PWD/target/ci-bin/moli-release-head/moli"
            run_side base "$PWD/target/ci-bin/moli-release-base/moli"
          else
            run_side base "$PWD/target/ci-bin/moli-release-base/moli"
            run_side head "$PWD/target/ci-bin/moli-release-head/moli"
          fi
      - name: Compare resilience and memory evidence
        id: comparison
        if: ${{ always() && !cancelled() && steps.soak.outcome == 'success' }}
        env:
          PYTHONPATH: moli-benchmark
        run: >-
          uv run --project moli-benchmark --no-sync python
          -m moli_benchmark.sequential_navigate_ci compare
          --base-report "$BENCHMARK_OUTPUT/base.json"
          --head-report "$BENCHMARK_OUTPUT/head.json"
          --base-exit-code "${{ steps.soak.outputs.base_exit_code }}"
          --head-exit-code "${{ steps.soak.outputs.head_exit_code }}"
          --base-sha "${{ needs.resolve-refs.outputs.base_sha }}"
          --head-sha "${{ needs.resolve-refs.outputs.head_sha }}"
          --execution-order "${{ needs.resolve-refs.outputs.execution_order }}"
          --expected-navigations 200
          --output "$BENCHMARK_OUTPUT/comparison.json"
          --comment-output "$BENCHMARK_OUTPUT/comment.md"
          --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --conclusion local
      - name: Render job summary
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        run: |
          if [[ -f "$BENCHMARK_OUTPUT/comment.md" ]]; then
            cat "$BENCHMARK_OUTPUT/comment.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload full evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sequential-navigation-soak-results
          path: ${{ env.BENCHMARK_OUTPUT }}
          if-no-files-found: error
          retention-days: 14
      - name: Require complete HEAD resilience evidence
        if: ${{ always() && !cancelled() && steps.comparison.outcome == 'success' }}
        env:
          PYTHONPATH: moli-benchmark
        run: >-
          uv run --project moli-benchmark --no-sync python
          -m moli_benchmark.sequential_navigate_ci check
          --input "$BENCHMARK_OUTPUT/comparison.json"

  prepare-webfetch-comparison-inputs:
    name: Prepare frozen Web Fetch inputs
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_webfetch_comparison == true }}
    runs-on: [self-hosted, moli-ci]
    timeout-minutes: 20
    env:
      SOURCE_DATASET_SHA256: dd3504d82e24cf292a1ec718c6c26774ca9184fe43821f053f1cd031e38a69e3
      SOURCE_RELEASE_TAG: webfetch-ci-input-dd3504d8
      SOURCE_ARCHIVE_NAME: webfetch-430-source-dd3504d8.tar.gz
      SOURCE_ARCHIVE_SHA256: 852b5e1ec872f2ec813f2663e02f7752b117f65a42cf5a84c4955ab6cde3b21d
    steps:
      - name: Download the private hash-bound source archive
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          ARCHIVE_PATH: ${{ runner.temp }}/${{ env.SOURCE_ARCHIVE_NAME }}
        with:
          script: |
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {owner: context.repo.owner, repo: context.repo.repo, per_page: 100},
            );
            const release = releases.find(item => item.tag_name === process.env.SOURCE_RELEASE_TAG);
            if (!release || !release.draft) {
              core.setFailed(`Missing private draft release ${process.env.SOURCE_RELEASE_TAG}`);
              return;
            }
            const asset = release.assets.find(item => item.name === process.env.SOURCE_ARCHIVE_NAME);
            if (!asset) {
              core.setFailed(`Missing release asset ${process.env.SOURCE_ARCHIVE_NAME}`);
              return;
            }
            const response = await github.request(
              'GET /repos/{owner}/{repo}/releases/assets/{asset_id}',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id,
                headers: {accept: 'application/octet-stream'},
              },
            );
            const bytes = response.data instanceof ArrayBuffer
              ? Buffer.from(response.data)
              : Buffer.from(response.data);
            require('fs').writeFileSync(process.env.ARCHIVE_PATH, bytes);

      - name: Verify and unpack the exact source bundle
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          archive=$RUNNER_TEMP/$SOURCE_ARCHIVE_NAME
          bundle=$RUNNER_TEMP/webfetch-430-source
          echo "$SOURCE_ARCHIVE_SHA256  $archive" | sha256sum --check
          if tar -tzf "$archive" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "Source archive contains an unsafe path" >&2
            exit 1
          fi
          mkdir -p "$bundle"
          tar -xzf "$archive" -C "$bundle"
          echo "$SOURCE_DATASET_SHA256  $bundle/dataset.json" | sha256sum --check
          test -d "$bundle/sources"
          test -d "$bundle/list-references"
          test -z "$(find "$bundle" -type l -print -quit)"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

      - name: Upload exact frozen inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webfetch-430-source-${{ env.SOURCE_DATASET_SHA256 }}
          path: ${{ steps.inputs.outputs.bundle }}
          compression-level: 6
          if-no-files-found: error
          retention-days: 1

  webfetch-comparison:
    name: Web Fetch · 430 cases · stable vs HEAD
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_webfetch_comparison == true }}
    needs: [resolve-refs, build-release-head, prepare-webfetch-comparison-inputs]
    runs-on: [self-hosted, moli-ci]
    timeout-minutes: 720
    container:
      image: rust:1.96.1-bookworm
      volumes:
        - moli-ci-cargo-home-1-96-1-v1:/usr/local/cargo
        - moli-ci-rustup-home-1-96-1-v1:/usr/local/rustup
    env:
      SOURCE_DATASET_SHA256: dd3504d82e24cf292a1ec718c6c26774ca9184fe43821f053f1cd031e38a69e3
      STABLE_ARCHIVE_URL: https://github.com/lexmount/moli/releases/download/v1.1.15/moli-x86_64-unknown-linux-gnu.tar.gz
      STABLE_ARCHIVE_SHA256: f7c9455451bffd4d3a6353431b3596c1d18ad4d9fe6725d8d4033f6fff5fa59d
      STABLE_BINARY_SHA256: 7a53cdd071ae60a2f8ff6d08107f67f6b0f1d6247a9acd970d2bcec77ff15b50
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-refs.outputs.head_sha }}

      - name: Use candidate release
        uses: ./.github/actions/use-ci-release
        with:
          side: head
          revision: ${{ needs.resolve-refs.outputs.head_sha }}

      - name: Checkout exact browser-eval runner
        uses: actions/checkout@v4
        with:
          repository: lexmount/browser-eval
          persist-credentials: false
          ref: ${{ inputs.browser_eval_ref }}
          path: browser-eval

      - name: Verify the exact browser-eval revision
        shell: bash
        run: test "$(git -C browser-eval rev-parse HEAD)" = '${{ inputs.browser_eval_ref }}'

      - name: Install cohort dependencies
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl jq

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.14
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: browser-eval/uv.lock

      - name: Install the frozen evaluation environment
        run: uv sync --project browser-eval --frozen --extra reference-audit

      - name: Download the exact unredacted source bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: webfetch-430-source-${{ env.SOURCE_DATASET_SHA256 }}
          path: target/webfetch-comparison/input

      - name: Verify the frozen source bundle
        shell: bash
        run: |
          set -euo pipefail
          root=$PWD/target/webfetch-comparison/input
          echo "$SOURCE_DATASET_SHA256  $root/dataset.json" | sha256sum --check
          test -d "$root/sources"
          test -d "$root/list-references"
          test -z "$(find "$root" -type l -print -quit)"

      - name: Pin stable and candidate executables
        shell: bash
        run: |
          set -euo pipefail
          root=$PWD/target/webfetch-comparison
          mkdir -p "$root/bin/stable" "$root/download"
          curl --fail --location --retry 3 --output "$root/download/moli-stable.tar.gz" \
            "$STABLE_ARCHIVE_URL"
          echo "$STABLE_ARCHIVE_SHA256  $root/download/moli-stable.tar.gz" | sha256sum --check
          tar -xzf "$root/download/moli-stable.tar.gz" -C "$root/bin/stable"
          mapfile -t stable_bins < <(find "$root/bin/stable" -type f -name moli -perm -u+x -print)
          test "${#stable_bins[@]}" -eq 1
          install -m 0755 "${stable_bins[0]}" "$root/bin/moli-1.1.15"
          echo "$STABLE_BINARY_SHA256  $root/bin/moli-1.1.15" | sha256sum --check

          candidate=$PWD/target/ci-bin/moli-release-head/moli
          test -x "$candidate"
          candidate_sha=$(sha256sum "$candidate" | cut -d' ' -f1)
          stable_version=$("$root/bin/moli-1.1.15" --version)
          candidate_version=$("$candidate" --version)
          test "$stable_version" = "moli 1.1.15"

          jq -n \
            --arg stable "$root/bin/moli-1.1.15" \
            --arg stable_sha "$STABLE_BINARY_SHA256" \
            --arg stable_version "$stable_version" \
            --arg candidate "$candidate" \
            --arg candidate_sha "$candidate_sha" \
            --arg candidate_version "$candidate_version" \
            '{schema_version: 1, providers: {
              "moli": {
                type: "moli_webfetch", label: "Moli 1.1.15",
                binary: $stable, expected_reported_version: $stable_version,
                expected_binary_sha256: $stable_sha,
                dns_mode: "system", wait_until: "done",
                block_private_networks: true, uniform_native_parameters: true,
                max_bytes: 20000000, log_level: "debug",
                retain_complete_diagnostic_log: true,
                max_diagnostic_bytes: 100000000
              },
              "moli-stack-1432": {
                type: "moli_webfetch", label: "Moli stack through PR #1432",
                source_url: "https://github.com/lexmount/moli/pull/1432",
                binary: $candidate, expected_reported_version: $candidate_version,
                expected_binary_sha256: $candidate_sha,
                dns_mode: "system", wait_until: "done",
                block_private_networks: true, uniform_native_parameters: true,
                max_bytes: 20000000, log_level: "debug",
                retain_complete_diagnostic_log: true,
                max_diagnostic_bytes: 100000000
              }
            }}' > "$root/providers.json"

          jq -n \
            --arg run_url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg candidate_revision "${{ needs.resolve-refs.outputs.head_sha }}" \
            --arg candidate_sha "$candidate_sha" \
            --arg candidate_version "$candidate_version" \
            --arg stable_sha "$STABLE_BINARY_SHA256" \
            --arg browser_eval_revision "${{ inputs.browser_eval_ref }}" \
            --arg dataset_sha "$SOURCE_DATASET_SHA256" \
            '{schema_version: 1, run_url: $run_url,
              candidate: {revision: $candidate_revision, binary_sha256: $candidate_sha,
                reported_version: $candidate_version},
              stable: {release: "v1.1.15", source_revision: "eaaf6f2dbfe26bf8de33387cd3ae6c31d0931a0e",
                binary_sha256: $stable_sha, reported_version: $stable_version},
              runner: {repository: "lexmount/browser-eval", revision: $browser_eval_revision},
              inputs: {dataset_sha256: $dataset_sha, case_count: 430,
                source: "private CI artifact prepared from the exact frozen unredacted bundle"},
              execution: {workers: 1, call_order: "case-alternating", runs: 1,
                caller_retries: 0, retrieval_mode: "native"}}' > "$root/run-receipt.json"

      - name: Run the complete certified cohort
        shell: bash
        run: |
          set -euo pipefail
          root=$PWD/target/webfetch-comparison
          dataset="$root/input/dataset.json"
          case_ids=$(uv run --project browser-eval --frozen python -c \
            'import json,sys; print(",".join(row["id"] for row in json.load(open(sys.argv[1]))["cases"]))' \
            "$dataset")
          test "$(tr ',' '\n' <<< "$case_ids" | wc -l)" -eq 430
          uv run --project browser-eval --frozen python \
            browser-eval/scripts/run_certified_benchmark.py \
            --dataset "$dataset" \
            --output "$root/evidence" \
            --work-root "$root/work" \
            --providers moli,moli-stack-1432 \
            --case-ids "$case_ids" \
            --provider-config "$root/providers.json" \
            --workers 1 \
            --call-order case-alternating \
            --retrieval-mode native

      - name: Verify completeness and render the paired difference inventory
        shell: bash
        run: |
          set -euo pipefail
          root=$PWD/target/webfetch-comparison
          uv run --project browser-eval --frozen python \
            browser-eval/scripts/audit_fixed_native_comparison.py \
            --evidence "$root/evidence" \
            --source-dataset "$root/input/dataset.json" \
            --provider-config "$root/providers.json" \
            --run-receipt "$root/run-receipt.json" \
            --output-json "$root/comparison-audit.json" \
            --output-markdown "$root/comparison-audit.md" \
            --stable-provider moli \
            --candidate-provider moli-stack-1432

      - name: Render completion summary
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        run: |
          root=$PWD/target/webfetch-comparison
          if [[ -f "$root/comparison-audit.md" ]]; then
            cat "$root/comparison-audit.md" >> "$GITHUB_STEP_SUMMARY"
          elif [[ -f "$root/evidence/results.jsonl" ]]; then
            calls=$(wc -l < "$root/evidence/results.jsonl")
            printf '## Incomplete Web Fetch comparison\n\n- Recorded calls: %s / 860\n- Candidate: `%s`\n' \
              "$calls" '${{ needs.resolve-refs.outputs.head_sha }}' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the complete private evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webfetch-comparison-${{ needs.resolve-refs.outputs.head_sha }}
          path: |
            target/webfetch-comparison/evidence
            target/webfetch-comparison/input
            target/webfetch-comparison/work
            target/webfetch-comparison/providers.json
            target/webfetch-comparison/run-receipt.json
            target/webfetch-comparison/comparison-audit.json
            target/webfetch-comparison/comparison-audit.md
          if-no-files-found: warn
          retention-days: 14
